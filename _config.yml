# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/
# 本文件是 blog_station 首次配置时拷入用户工作区的站点配置基线。
# 站点 title/subtitle/description/author/url 均为占位文本，请在 App 设置界面修改。

# Site
title: 我的博客
subtitle: '记录与思考'
description: '由 blog_station 创建的 Hexo 博客，站点描述待修改。'
keywords:
author: blog_station 用户
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: 'https://example.github.io'
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Sort by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## Metadata: https://hexo.io/docs/metadata.html
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: only include/exclude some specific directory/files
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid

# Markdown 渲染器：hexo-renderer-markdown-it-plus（替代 marked，避免公式被转义）
## KaTeX 插件默认启用，$...$/$$...$$ 渲染为 katex HTML，CSS/JS 由 Fluid post.math(engine: katex) 注入
## breaks/typographer 关闭以保持与 marked 一致的换行与引号语义
markdown_it_plus:
  highlight: true
  html: true
  xhtmlOut: true
  breaks: false
  langPrefix:
  linkify: true
  typographer: false
  pre_class: highlight

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
## 博客通过 .github/workflows/deploy.yml（GitHub Actions 官方 Pages artifact 流程）部署
deploy:
  type: ''
