# Fluid 主题配置覆盖（blog_station 基线）
# 仅覆盖与主题默认不同的项；完整默认配置见 node_modules/hexo-theme-fluid/_config.yml
# 架构文档第二节：last edited 通过 front-matter updated + Fluid post.meta.updated 展示（默认关闭，模板开启）
post:
  meta:
    updated:
      enable: true
      format: 'LL'
  # 数学公式：marked 渲染器会转义公式内容，配合 hexo-renderer-markdown-it-plus 输出 katex HTML，
  # Fluid 在文章页注入 KaTeX 资源；specific: false 表示全部文章生效（无需逐篇 front-matter 开关）
  math:
    enable: true
    specific: false
    engine: katex
